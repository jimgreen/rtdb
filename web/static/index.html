<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RTDB 管理台</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">RTDB WEB SERVICE</p>
      <h1>表结构与数据管理</h1>
    </div>
    <button id="refresh" class="secondary">刷新</button>
  </header>
  <main class="layout">
    <aside class="panel tables-panel">
      <div class="panel-title"><h2>表</h2><button id="new-table" class="small">新建</button></div>
      <div id="table-list" class="table-list"><p class="muted">正在加载…</p></div>
    </aside>
    <section class="content">
      <div id="notice" class="notice" hidden></div>
      <section class="panel">
        <div class="panel-title"><h2>表结构</h2><div><button id="save-schema">保存结构</button><button id="delete-schema" class="danger">删除结构</button></div></div>
        <p class="muted">JSON 定义：head + columns，字段使用最终命名。</p>
        <textarea id="schema-editor" class="editor" spellcheck="false" aria-label="表结构 JSON"></textarea>
      </section>
      <section class="panel">
        <div class="panel-title"><h2>表数据</h2><div><button id="add-row">新增行</button><button id="delete-rows" class="danger">删除选中</button></div></div>
        <div class="toolbar"><input id="where" placeholder='条件，例如 age >= 18 或 {"status":"启用"}'><input id="order-by" placeholder="排序，例如 id DESC"><button id="query">查询</button></div>
        <div id="data-grid" class="grid-wrap"><p class="muted">请选择一张表。</p></div>
      </section>
    </section>
  </main>
  <dialog id="row-dialog">
    <form method="dialog" class="dialog-form">
      <div class="panel-title"><h2 id="row-dialog-title">新增行</h2><button value="cancel" class="icon">×</button></div>
      <textarea id="row-editor" class="editor" spellcheck="false" aria-label="行 JSON"></textarea>
      <div class="dialog-actions"><button value="cancel" class="secondary">取消</button><button id="save-row" value="default">保存</button></div>
    </form>
  </dialog>
  <script src="/static/app.js"></script>
</body>
</html>
